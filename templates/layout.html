<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
    {% block links %}
    {% endblock %}
    <link rel="stylesheet" href="{{url_for('static',filename='layout.css')}}">
    <title>Document</title>
    <script src="{{ url_for('static', filename='local_time.js') }}" defer></script>
</head>
<body>
    <div class="sidebar">
        <a href="/">
            <div class="account-op">
                <h4>account options</h4> <!-- dose not do anything for now -->
            </div>
        </a>
        <div class="add-task">
            <button onclick="openAddTaskModal()" class="add-task-button">+</button>
            <h3>Add Task button</h3>
        </div>
        <div>
            <a href="{{ url_for('today') }}" class="page-button">today</a>
        </div>
        <div>
            <a href="{{ url_for('upcoming') }}" class="page-button">upcoming</a>
        </div>
        <div>
            <a href="{{ url_for('ongoing') }}" class="page-button">goals/ongoing</a>
        </div>
        <div>
            <a href="{{ url_for('completed_tasks') }}" class="page-button">completed</a>
        </div>
    </div>
    {% block div_for_layout %}
    {% endblock %}
    <div class="page-display">
        <div class="header">
            <a href="/home" class="home-button">ToDo</a>
            <p class="datetime">{{ user_local_date }}</p>
        </div>
    {% block body %}
    {% endblock %}
    </div>

    <!-- Add Task Modal -->
    <div id="addTaskModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5);">
        <div style="background:#fff; padding:20px; max-width:400px; margin:100px auto; border-radius:10px; text-align:center;">
            <h3>Add New Task</h3>
            <input id="newTaskTitle" type="text" placeholder="Title" style="width:90%; margin:5px;"><br>
            <textarea id="newTaskDesc" placeholder="Description" style="width:90%; margin:5px;"></textarea><br>
            <label><input type="checkbox" id="newTaskAllDay" onchange="toggleAllDay('new')"> All Day</label><br>
            <input id="newTaskStart" type="datetime-local" style="width:90%; margin:5px;"><br>
            <button onclick="addTask()">Add</button>
            <button onclick="closeAddTaskModal()">Cancel</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='task_manage.js') }}" defer></script>

</body>
</html>
